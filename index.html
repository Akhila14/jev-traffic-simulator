.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const fmt = value =&gt; `${Number(value).toFixed(1)} s`;

  function setSignal(element, state) {
    element.style.fill = state === &#x27;green&#x27; ? &#x27;var(--green)&#x27; : state === &#x27;clearance&#x27; ? &#x27;var(--yellow)&#x27; : &#x27;var(--red)&#x27;;
  }

  function renderComparison() {
    const order = {fixed_time:0, jev_raw:1};
    const rows = DATA.aggregate.aggregate_by_scenario
      .filter(row =&gt; row.scenario === scenario.value &amp;&amp; row.controller in order)
      .sort((a, b) =&gt; order[a.controller] - order[b.controller]);
    comparison.replaceChildren(...rows.map(row =&gt; {
      const tr = document.createElement(&#x27;tr&#x27;);
      if (row.controller === controller.value) tr.className = &#x27;is-selected&#x27;;
      const values = [labels[row.controller], fmt(row.average_wait_s), fmt(row.p95_wait_s), Number(row.average_queue_vehicles).toFixed(1)];
      values.forEach((value, index) =&gt; {
        const cell = document.createElement(index === 0 ? &#x27;th&#x27; : &#x27;td&#x27;);
        cell.textContent = value;
        if (index &gt; 0) cell.className = &#x27;text-end&#x27;;
        tr.appendChild(cell);
      });
      return tr;
    }));
  }

  function renderOverall() {
    const rank = {jev_raw:0, fixed_time:1};
    const rows = DATA.aggregate.overall.filter(row =&gt; row.controller in rank).sort((a, b) =&gt; rank[a.controller] - rank[b.controller]);
    overall.replaceChildren(...rows.map(row =&gt; {
      const item = document.createElement(&#x27;div&#x27;);
      item.className = `sw-result${row.controller.startsWith(&#x27;jev_&#x27;) ? &#x27; is-jev&#x27; : &#x27;&#x27;}`;
      const confidence = row.average_confidence == null ? &#x27;—&#x27; : Number(row.average_confidence).toFixed(2);
      const name = document.createElement(&#x27;span&#x27;);
      name.className = &#x27;sw-result-name&#x27;;
      name.textContent = labels[row.controller];
      const value = document.createElement(&#x27;span&#x27;);
      value.className = &#x27;sw-result-value tabular-nums&#x27;;
      value.textContent = `${Number(row.average_wait_s).toFixed(2)} s`;
      const meta = document.createElement(&#x27;span&#x27;);
      meta.className = &#x27;sw-result-meta&#x27;;
      meta.textContent = `P95 ${Number(row.p95_wait_s).toFixed(2)} · avg queue ${Number(row.average_queue_vehicles).toFixed(2)}${confidence === &#x27;—&#x27; ? &#x27;&#x27; : ` · confidence ${confidence}`}`;
      item.append(name, value, meta);
      return item;
    }));
  }

  function renderFrame() {
    const index = Number(slider.value);
    const frame = run.trace[index];
    const [seconds, inner, eighty, phase, innerWait, eightyWait] = frame;
    const scale = Math.max(1, ...run.trace.map(row =&gt; Math.max(row[1], row[2])));
    const innerWidth = Math.min(240, inner / scale * 240);
    const eightyHeight = Math.min(125, eighty / scale * 125);
    innerQueue.setAttribute(&#x27;x&#x27;, String(300 - innerWidth));
    innerQueue.setAttribute(&#x27;width&#x27;, String(innerWidth));
    eightyQueue.setAttribute(&#x27;height&#x27;, String(eightyHeight));
    setSignal(innerSignal, phase === &#x27;clearance&#x27; ? &#x27;clearance&#x27; : phase === &#x27;inner_ring_road&#x27; ? &#x27;green&#x27; : &#x27;red&#x27;);
    setSignal(eightySignal, phase === &#x27;clearance&#x27; ? &#x27;clearance&#x27; : phase === &#x27;koramangala_80_feet_road&#x27; ? &#x27;green&#x27; : &#x27;red&#x27;);
    innerCount.textContent = `${inner} vehicles · oldest ${innerWait}s`;
    eightyCount.textContent = `${eighty} vehicles · oldest ${eightyWait}s`;
    timeLabel.textContent = `${String(Math.floor(seconds / 60)).padStart(2,&#x27;0&#x27;)}:${String(seconds % 60).padStart(2,&#x27;0&#x27;)}`;
    const phaseText = phase === &#x27;clearance&#x27; ? &#x27;Clearance interval&#x27; : phase === &#x27;inner_ring_road&#x27; ? &#x27;Inner Ring Road green&#x27; : &#x27;80 Feet Road green&#x27;;
    live.textContent = `${labels[controller.value]} · ${phaseText}`;
  }

  function loadRun(shouldStop = true) {
    if (shouldStop) stop();
    run = DATA.runs[runKey()];
    slider.max = String(run.trace.length - 1);
    slider.value = &#x27;0&#x27;;
    const scenarioResult = DATA.aggregate.aggregate_by_scenario.find(row =&gt; row.scenario === scenario.value &amp;&amp; row.controller === controller.value);
    root.querySelector(&#x27;#sw-mean-wait&#x27;).textContent = fmt(scenarioResult.average_wait_s);
    root.querySelector(&#x27;#sw-p95-wait&#x27;).textContent = fmt(scenarioResult.p95_wait_s);
    root.querySelector(&#x27;#sw-max-queue&#x27;).textContent = `${Number(scenarioResult.maximum_queue_vehicles).toFixed(1)} vehicles`;
    root.querySelector(&#x27;#sw-run-label&#x27;).textContent = `${scenario.options[scenario.selectedIndex].textContent} · average of 3 seeds`;
    root.querySelector(&#x27;#sw-mode&#x27;).textContent = `Replay seed ${replicate.value}`;
    scenarioName.textContent = scenario.options[scenario.selectedIndex].textContent;
    scenarioDescription.textContent = scenarioDescriptions[scenario.value];
    controllerName.textContent = labels[controller.value];
    controllerDescription.textContent = controllerDescriptions[controller.value];
    renderComparison();
    renderOverall();
    renderFrame();
  }

  function stop() {
    if (timer) clearInterval(timer);
    storyTimers.forEach(id =&gt; clearTimeout(id));
    storyTimers = [];
    timer = null;
    storyActive = false;
    play.textContent = &#x27;Play run&#x27;;
    play.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
    story.textContent = &#x27;▶ 25s story&#x27;;
    story.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
    [scenario, controller, replicate, play].forEach(element =&gt; { element.disabled = false; });
    root.querySelectorAll(&#x27;.sw-story-steps span&#x27;).forEach(element =&gt; element.classList.remove(&#x27;is-active&#x27;));
    root.querySelector(&#x27;.sw-outcome&#x27;).classList.remove(&#x27;is-focus&#x27;);
    root.classList.remove(&#x27;sw-story-running&#x27;);
  }

  function activateStoryStep(step) {
    root.querySelectorAll(&#x27;.sw-story-steps span&#x27;).forEach(element =&gt; element.classList.toggle(&#x27;is-active&#x27;, element.dataset.step === step));
  }

  function startStory() {
    stop();
    storyActive = true;
    root.classList.remove(&#x27;sw-before-story&#x27;);
    root.classList.add(&#x27;sw-story-running&#x27;);
    story.textContent = &#x27;Stop story&#x27;;
    story.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
    scenario.value = &#x27;morning_peak&#x27;;
    replicate.value = &#x27;1&#x27;;
    [scenario, controller, replicate, play].forEach(element =&gt; { element.disabled = true; });
    const stages = [
      {controller:&#x27;fixed_time&#x27;, start:18},
      {controller:&#x27;jev_raw&#x27;, start:18}
    ];

    function runStage(index) {
      if (!storyActive) return;
      const stage = stages[index];
      controller.value = stage.controller;
      loadRun(false);
      slider.value = String(stage.start);
      renderFrame();
      activateStoryStep(stage.controller);
      timer = setInterval(() =&gt; {
        const next = Math.min(Number(slider.max), Number(slider.value) + 1);
        slider.value = String(next);
        renderFrame();
      }, 125);
      storyTimers.push(setTimeout(() =&gt; {
        clearInterval(timer);
        timer = null;
        if (index &lt; stages.length - 1) {
          runStage(index + 1);
        } else {
          activateStoryStep(&#x27;result&#x27;);
          root.classList.remove(&#x27;sw-story-running&#x27;);
          root.querySelector(&#x27;.sw-outcome&#x27;).classList.add(&#x27;is-focus&#x27;);
          live.textContent = &#x27;Overall: Jev 24.15 s average wait · fixed timer 33.42 s&#x27;;
          storyTimers.push(setTimeout(() =&gt; {
            storyActive = false;
            story.textContent = &#x27;↻ Replay 25s&#x27;;
            story.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
            [scenario, controller, replicate, play].forEach(element =&gt; { element.disabled = false; });
          }, 7000));
        }
      }, 9000));
    }
    runStage(0);
  }

  play.addEventListener(&#x27;click&#x27;, () =&gt; {
    if (timer) { stop(); return; }
    play.textContent = &#x27;Pause&#x27;;
    play.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
    timer = setInterval(() =&gt; {
      const next = Number(slider.value) + 1;
      if (next &gt; Number(slider.max)) { stop(); return; }
      slider.value = String(next);
      renderFrame();
    }, 180);
  });
  story.addEventListener(&#x27;click&#x27;, () =&gt; {
    if (storyActive) { stop(); loadRun(false); return; }
    startStory();
  });
  slider.addEventListener(&#x27;input&#x27;, renderFrame);
  scenario.addEventListener(&#x27;change&#x27;, () =&gt; loadRun());
  controller.addEventListener(&#x27;change&#x27;, () =&gt; loadRun());
  replicate.addEventListener(&#x27;change&#x27;, () =&gt; loadRun());
  loadRun();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
